version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Major TypeScript bumps routinely break `tsc`; review them deliberately
      # (tracked as an issue) rather than auto-proposing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The native rasteriser is pinned and rendering-critical: any version change
      # can move golden hashes and needs `golden:update`, so it changes only
      # deliberately, never via Dependabot.
      - dependency-name: "@napi-rs/canvas"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
