name: Copilot Setup Steps

# The Copilot agent's environment (spec 007, contracts/setup-steps.md). Separate
# automation, never part of verify (constitution Principle VI). Runs before the
# agent starts: Node, dependencies, arm64 emulation and the container image the
# cross-processor reference refresh needs. Setup steps run outside the agent's
# firewall, so privileged setup belongs here.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

jobs:
  # The job MUST be called copilot-setup-steps or it will not be picked up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pre-pull the arm64 container image
        run: docker pull --platform linux/arm64 node:22

      - name: Smoke check arm64 emulation
        run: test "$(docker run --rm --platform linux/arm64 node:22 uname -m)" = "aarch64"