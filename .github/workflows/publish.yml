name: Publish

# Release automation, separate from the one-job Verify CI (constitution Principle
# VI). It runs only when a maintainer pushes a `v*` tag; verify already ran on
# that push via the pre-push hook. It does not run `npm run verify`.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Authenticated with a classic Automation token stored as NPM_TOKEN.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
