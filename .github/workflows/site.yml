name: Site

# The community site deploy, separate automation that is never part of verify
# (constitution Principle VI, the same separation RELEASING.md records for
# publish.yml). Paths-filtered: a typical push (a primitive, a gate, a
# dependency) adds zero runs; only site-affecting pushes deploy. The workflow
# regenerates and rebuilds before it deploys, so the published site can never
# be stale, and it never runs `npm run verify` or pushes anything back.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gallery/**"
      - "loops/**"
      - "VOCABULARY.md"
      - "CONTRIBUTING.md"
      - "scripts/generate-site.ts"
      - "scripts/generate-loops.ts"
      - ".github/workflows/site.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run loops:generate
      - run: npm run site:generate
      - run: npm run site:check
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4