name: Verify

# One workflow, one job (constitution Principle VI). Runs on every push to main
# and every pull request, plus manual dispatch. The secret scan and CLA check run
# in this same job; no second workflow or self-hosted runner is introduced.
# For agent-authored pull requests only, the agent PR guard (spec 007) runs in
# this job too and decides the licence rule; every other pull request takes
# exactly the steps below (SC-008).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # Author logins treated as the Copilot agent (spec 007; research R7: the
      # PR identity is copilot-swe-agent, the assignee identity is Copilot).
      AGENT_LOGINS: "Copilot,copilot-swe-agent"
    steps:
      - uses: actions/checkout@v7

      - name: Secret scan
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz
          ./gitleaks detect --source . --no-banner --exit-code 1

      - name: CLA check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Agent pull requests are decided by the agent PR guard below (FR-013).
          if printf '%s\n' "$AGENT_LOGINS" | tr ',' '\n' | sed 's/^ *//' | grep -qxF "$AUTHOR"; then
            echo "agent pull request: licence decided by the agent PR guard"
            exit 0
          fi
          fetch_signers() {
            gh api "repos/${{ github.repository }}/contents/CLA-SIGNERS.json?ref=$1" --jq '.content' 2>/dev/null \
              | base64 -d 2>/dev/null | jq -r '.signers[].login' 2>/dev/null
          }
          SIGNERS="$(fetch_signers "$BASE")"
          # Fall back to the PR head only when the list is not yet on the base
          # branch (the bootstrap PR that first introduces the file).
          if [ -z "$SIGNERS" ]; then SIGNERS="$(fetch_signers "$HEAD")"; fi
          if printf '%s\n' "$SIGNERS" | grep -qxF "$AUTHOR"; then
            echo "CLA signed: $AUTHOR"
          else
            echo "::error::$AUTHOR has not signed the CLA (see CLA.md)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Agent PR guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/agent-pr-guard.ts --pr ${{ github.event.pull_request.number }}
      - run: npm run verify
